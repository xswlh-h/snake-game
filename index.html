<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇小游戏</h1>
        <div class="score-board">
            <div class="score-item">得分: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="highScore">0</span></div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">准备好了吗？</h2>
                    <p id="overlayText">按空格键或点击开始</p>
                </div>
            </div>
        </div>
        <div class="controls">
            <p class="hint">使用方向键或 WASD 控制方向 | 空格键暂停/继续</p>
            <div class="mobile-controls">
                <button class="mobile-btn" data-dir="up">▲</button>
                <div class="mobile-row">
                    <button class="mobile-btn" data-dir="left">◀</button>
                    <button class="mobile-btn" data-dir="down">▼</button>
                    <button class="mobile-btn" data-dir="right">▶</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
